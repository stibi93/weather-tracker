[project]
name = "weather-tracker-ingest"
version = "0.1.0"
description = "Ingest pipeline a magyar vízállás-/csapadék-térképhez (ports & adapters)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
weather-tracker-ingest = "ingest.pipeline.run:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ingest*"]

[tool.pytest.ini_options]
testpaths = ["ingest/tests"]
